<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:4096px;height:2304px;overflow:hidden}
body{font-family:'Poppins',sans-serif;color:#00334d;position:relative;
 background:linear-gradient(135deg,#1a1a2e 0%,#16213e 55%,#0f3460 100%)}
.halo{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55}
.h1{width:1600px;height:1600px;left:-400px;top:-500px;background:#8BC7B1;opacity:.18}
.h2{width:1400px;height:1400px;right:-300px;bottom:-600px;background:#4a90e2;opacity:.22}
.grille{position:absolute;inset:0;background-image:radial-gradient(rgba(139,199,177,.14) 3px,transparent 3px);background-size:96px 96px}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:220px}
.anneau{position:relative;width:1500px;height:1500px;flex:none}
.anneau span{position:absolute;border-radius:50%}
.anneau img{filter:brightness(0) invert(1);position:absolute;left:50%;top:50%;width:600.0px;height:600.0px;transform:translate(-50%,-50%);object-fit:contain}
.texte{max-width:1700px}
.sur{font-weight:600;font-size:64px;letter-spacing:.32em;text-transform:uppercase;color:#b0b0b0;margin:0 0 30px}
h1{font-family:'Montserrat',sans-serif;font-weight:700;font-size:210px;line-height:1.02;margin:0;color:#ffffff;letter-spacing:-.01em}
.role{font-weight:600;font-size:96px;margin:36px 0 0;color:#ffffff}
.role b{color:#8BC7B1;font-weight:600}
.ligne{width:260px;height:12px;border-radius:6px;background:linear-gradient(135deg,#00334d 0%,#8BC7B1 100%);margin:64px 0 56px}
.detail{font-size:60px;color:#b0b0b0;margin:0;line-height:1.5}
.url{font-size:60px;font-weight:600;color:#8BC7B1;margin:56px 0 0}
