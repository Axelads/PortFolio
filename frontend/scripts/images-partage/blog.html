<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Image de partage — blog {{LABEL}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      width: 1200px; height: 630px; overflow: hidden; position: relative;
      font-family: 'Poppins', sans-serif; color: #ffffff;
      background: {{GRADIENT}};
    }
    body::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 82% 22%, rgba(255, 255, 255, 0.16), transparent 42%),
                  radial-gradient(circle at 10% 90%, rgba(0, 0, 0, 0.18), transparent 50%);
    }
    .glyphe {
      position: absolute; left: 96px; top: 50%; transform: translateY(-50%);
      width: 300px; height: 300px; border-radius: 48px; display: flex; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.14); border: 2px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
      font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 128px; letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.94); text-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    }
    .texte { position: absolute; left: 470px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 14px; max-width: 640px; }
    .sur { margin: 0; font-weight: 600; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.78); }
    .titre { margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 84px; line-height: 1; letter-spacing: -0.02em; }
    .sous { margin: 8px 0 0; font-weight: 300; font-size: 28px; line-height: 1.4; color: rgba(255, 255, 255, 0.86); }
    .pied { position: absolute; left: 96px; bottom: 44px; display: flex; align-items: center; gap: 16px; }
    .pied img { width: 56px; height: 56px; }
    .pied span { font-size: 24px; color: rgba(255, 255, 255, 0.8); }
  </style>
</head>
<body>
  <div class="glyphe">{{GLYPH}}</div>
  <div class="texte">
    <p class="sur">Blog · Axel Grégoire</p>
    <h1 class="titre">{{LABEL}}</h1>
    <p class="sous">Veille technique en français, avec du code à copier.</p>
  </div>
  <div class="pied">
    <img src="../../public/logo_Axel_Gregoire_bubbles.png" alt="" />
    <span>axelgregoire.fr/blog</span>
  </div>
</body>
</html>
